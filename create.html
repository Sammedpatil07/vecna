<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Create Post Modal Clone</title>
    <link rel="stylesheet" href="create.css">
    <style>
        /* Basic styling for the body and a button to open the modal for demonstration */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #fafafa;
        }
        .open-modal-btn {
            padding: 10px 20px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
            <div class="modal-header">
                <h2>Create new post</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-content">
                <div class="upload-area">
                    <svg aria-label="Icon to represent media such as images and videos" class="media-icon" color="#262626" fill="#262626" height="77" role="img" viewBox="0 0 97.6 77.3" width="96">
                        <path d="M16.3 35.5H8.3a8 8 0 0 0-8 8v24a8 8 0 0 0 8 8h63a8 8 0 0 0 8-8v-24a8 8 0 0 0-8-8H16.3Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        <path d="m81.3 27.5-3.4-3.4a8 8 0 0 0-5.6-2.3H16.3a8 8 0 0 0-8 8v34a8 8 0 0 0 8 8h63a8 8 0 0 0 8-8v-34a8 8 0 0 0-8-8Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        <circle cx="29.5" cy="40.5" fill="none" r="3.7" stroke="currentColor" stroke-width="2"></circle>
                        <path d="M49 48.5 39.5 58a8 8 0 0 1-5.6 2.3h-4a8 8 0 0 1-5.6-2.3l-5.6-5.6a8 8 0 0 0-5.6-2.3h-4a8 8 0 0 0-5.6 2.3l-5.6 5.6" fill="none" stroke="currentColor" stroke-width="2"></path>
                        <path d="M78 37.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z" fill="currentColor"></path>
                        <path d="M25 40.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z" fill="currentColor"></path>
                        <path d="M45 40.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z" fill="currentColor"></path>
                        <path d="M65 40.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z" fill="currentColor"></path>
                        <path d="M85 40.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z" fill="currentColor"></path>
                        <polygon fill="currentColor" points="76 10 76 17 69 17 69 10 76 10"></polygon>
                        <polygon fill="currentColor" points="76 20 76 27 69 27 69 20 76 20"></polygon>
                        <rect fill="currentColor" height="7" width="7" x="78" y="10"></rect>
                    </svg>
                    
                    <p class="drag-text">Drag photos and videos here</p>
                    <button class="select-btn" id="selectFileBtn">Select from computer</button>
                    <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display: none;">
                </div>
            </div>
        </div>

    <script src="create.js"></script>
</body>
</html>
