<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Analytics</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .analytics-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }
       
        .analytics-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .insight-box {
            background: #007bff;
            color: #fff;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }
        .insight-box:hover
        {
            background-color:#364b63 ;
        }
        .reach-box {
            background: #28a745;
            color: #fff;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }
        .reach-box:hover
        {
            background-color:#295333 ;
        }
        .overall-box {
            background: #ff9800;
            color: #fff;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }
        .overall-box:hover
        {
            background-color:#614a2a ;
        }

        .value {
            font-size: 26px;
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }
        .ppbtn{
            border-radius: 50px;
            width: 100px;
            background-color: purple;
        }
        .ppbtn:hover{
            background-color: #6D28D9;
        }
    </style>
</head>
<body>

    <div class="analytics-container">
        <div class="analytics-title">Social Media Analytics</div>
        
        <div class="insight-box">
            Post Views
            <span class="value">12,500</span>
        </div>
        
        <div class="reach-box">
            Account Reach
            <span class="value">7,800</span>
        </div>

        <div class="overall-box">
            Overall Engagement
            <span class="value">3,250</span>
        </div>
        <div>
       <a href="profile.html"><button class="ppbtn">Visit Profile</button></a>
        </div>
    </div>

</body>
</html>
