<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: hsl(268, 100%, 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .profile-container {
            width: 350px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .profile-header {
            background: hsl(268, 100%, 50%);
            padding: 50px 20px;
            position: relative;
        }
        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 80px;
            background: white;
        }
        .profile-info {
            margin-top: 60px;
            padding: 20px;
        }
        .profile-info h2 {
            margin: 10px 0;
            font-size: 20px;
        }
        .profile-info p {
            color: #666;
            font-size: 14px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #eee;
        }
        .stats div {
            text-align: center;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .follow-btn {
            background: hsl(268, 100%, 50%);
            color: white;
        }
        .message-btn {
            background: white;
            color: hsl(268, 100%, 50%);
            border: 2px solid hsl(268, 100%, 50%);
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            padding: 10px;
        }
        .gallery img {
            width: 100%;
            border-radius: 5px;
        }
        .modal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.4);
    }
    .modal-content {
        background-color: white;
        margin: 15% auto;
        padding: 20px;
        border-radius: 10px;
        width: 80%;
        max-width: 400px;
        text-align: left;
    }
    .modal-content h2 {
        margin-top: 0;
    }
    .modal-content label {
        display: block;
        margin: 10px 0 5px;
    }
    .modal-content input,
    .modal-content textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }
    .close:hover,
    .close:focus {
        color: black;
        text-decoration: none;
    }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <img src="assets/m.jpeg" alt="Profile Picture" class="profile-pic">
        </div>
        <div class="profile-info">
            <h2>Annabella</h2>
            <p>Singer | Dancer|Belive in Ghost | Daily 🟢</p>
            <div class="buttons">
                <button class="btn message-btn" onclick="openEditProfile()">Edit Profile</button>
            </div>
    
            <!-- Add this modal for editing profile -->
            <div id="editProfileModal" class="modal">
                <div class="modal-content">
                    <span class="close" onclick="closeEditProfile()">&times;</span>
                    <h2>Edit Profile</h2>
                    <form id="editProfileForm">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" value="Annabella">
                        <label for="bio">Bio:</label>
                        <textarea id="bio" name="bio">Singer | Dancer|Belive in Ghost | Daily 🟢</textarea>
                        <button type="submit" class="btn follow-btn">Save Changes</button>
                    </form>
                </div>
            </div>
            
        </div>
        <div class="stats">
            <div>
                <strong>80</strong><br>Posts
            </div>
            <div>
                <strong>1.2M</strong><br>Followers
            </div>
            <div>
                <strong>152</strong><br>Following
            </div>
        </div>
        <div class="gallery">
            <img src="assets/tob.jpg" alt="">
            <img src="assets/story.jpg" alt="">
            <img src="assets/viv.jpeg" alt="">
            <img src="assets/varun1.jpg" alt="">
            <img src="assets/WhatsApp Image 2025-03-20 at 9.13.35 AM.jpeg" alt="">
            <img src="assets/sammed1.jpeg" alt="">
        </div>
    </div>
    <script>
        // JavaScript to handle modal open and close
        function openEditProfile() {
            document.getElementById('editProfileModal').style.display = 'block';
        }
    
        function closeEditProfile() {
            document.getElementById('editProfileModal').style.display = 'none';
        }
    
        // Handle form submission
        document.getElementById('editProfileForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const bio = document.getElementById('bio').value;
    
            // Update profile info dynamically
            document.querySelector('.profile-info h2').textContent = name;
            document.querySelector('.profile-info p').textContent = bio;
    
            // Close modal
            closeEditProfile();
        });
    </script>
</body>
</html>
